<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked by Stronguard</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .box {
        max-width: 560px;
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        margin: 12px 0 6px;
      }
      .url {
        font: 13px ui-monospace, Consolas, monospace;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        margin: 14px 0;
        word-break: break-all;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 8px;
      }
      details {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="../icons/on-128.png" width="64" height="64" alt="" />
      <h1>Stronguard blocked this page</h1>
      <p class="muted">It belongs to a known advertising, popup, tracking or malvertising network.</p>
      <div class="url" id="url">…</div>
      <div class="actions">
        <button id="back">Go back</button>
        <button id="close" class="ghost">Close tab</button>
      </div>
      <details>
        <summary>Open it anyway</summary>
        <div class="actions" style="margin-top: 12px">
          <button id="once" class="ghost">Allow once</button>
          <button id="always" class="ghost">Always allow this site</button>
        </div>
      </details>
    </div>
    <script src="blocked.js" type="module"></script>
  </body>
</html>
