name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Tests, extension build and Chromium end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit and network tests
        run: npm test
      - name: Build extension (downloads filter lists)
        run: npm run package
      - name: End-to-end test in Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: stronguard-extension
          path: dist/*.zip

  windows:
    name: Windows install / uninstall
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $tmp = $env:RUNNER_TEMP
          node network/bin/stronguard.js firewall --level 5 --serve-lan --data "$tmp\sgcheck" | Set-Content "$tmp\fw.ps1"
          node network/bin/stronguard.js policies --level 5 --windows-ads --data "$tmp\sgcheck" | Set-Content "$tmp\pol.ps1"
          foreach ($f in @('windows\install.ps1', 'windows\uninstall.ps1', "$tmp\fw.ps1", "$tmp\pol.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "Parse errors in $f" }
          }
      - name: Spotify ad muter self-test (Windows PowerShell 5.1)
        shell: powershell
        run: .\windows\spotify-muter.ps1 -SelfTest
      - name: Install the network shield (level 4, Windows ads off, hosts fallback)
        shell: powershell
        run: .\windows\install.ps1 -Level 4 -WindowsAds -Hosts -NoOpen
      - name: Verify every layer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Clear-DnsClientCache
          $blocked = Resolve-DnsName -Name doubleclick.net -Type A -DnsOnly
          if (-not ($blocked | Where-Object IPAddress -eq '0.0.0.0')) { throw 'doubleclick.net was not sinkholed' }
          $allowed = Resolve-DnsName -Name github.com -Type A -DnsOnly
          if (-not ($allowed | Where-Object { $_.IPAddress -and $_.IPAddress -ne '0.0.0.0' })) { throw 'github.com did not resolve' }
          $rules = @(Get-NetFirewallRule -Group Stronguard)
          if ($rules.Count -lt 6) { throw "expected firewall rules, found $($rules.Count)" }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Google\Chrome').DefaultPopupsSetting -ne 2) { throw 'Chrome popup policy missing' }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Edge').DnsOverHttpsMode -ne 'off') { throw 'Edge DoH policy missing' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings').AutoConfigURL -ne 'http://127.0.0.1:8118/proxy.pac') { throw 'PAC not set' }
          if (-not (Select-String -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Pattern 'Stronguard' -Quiet)) { throw 'hosts block missing' }
          if (-not (Get-ScheduledTask -TaskName 'Stronguard Spotify ad muter' -ErrorAction SilentlyContinue)) { throw 'Spotify muter task missing' }
          $status = Invoke-RestMethod http://127.0.0.1:8080/api/status
          "Level $($status.level): $($status.engine.domains) blocked domains, $($status.stats.queries) queries, $($status.stats.blocked) blocked"
          node network/bin/stronguard.js status
          # Changing the level from the dashboard API re-applies the firewall layer.
          Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"level":2}' http://127.0.0.1:8080/api/level | Out-Null
          Start-Sleep -Seconds 15
          $after = @(Get-NetFirewallRule -Group Stronguard -ErrorAction SilentlyContinue).Count
          if ($after -ne 0) { throw "level 2 should have no firewall rules, found $after" }
      - name: Service log
        if: always()
        shell: powershell
        run: Get-Content "$env:ProgramData\Stronguard\stronguard.log" -ErrorAction SilentlyContinue | Select-Object -Last 60
      - name: Uninstall
        if: always()
        shell: powershell
        run: .\windows\uninstall.ps1
      - name: Verify clean uninstall
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-ScheduledTask -TaskName Stronguard -ErrorAction SilentlyContinue) { throw 'scheduled task still present' }
          if (Get-ScheduledTask -TaskName 'Stronguard Spotify ad muter' -ErrorAction SilentlyContinue) { throw 'Spotify muter task still present' }
          if (@(Get-NetFirewallRule -Group Stronguard -ErrorAction SilentlyContinue).Count) { throw 'firewall rules left behind' }
          if (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Google\Chrome' -Name DefaultPopupsSetting -ErrorAction SilentlyContinue) { throw 'Chrome policy left behind' }
          if (Select-String -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Pattern 'Stronguard' -Quiet) { throw 'hosts block left behind' }
          Clear-DnsClientCache
          Resolve-DnsName -Name github.com -DnsOnly | Out-Null
          'Uninstall left the system clean.'
